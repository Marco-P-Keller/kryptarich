name: kryptaapp
description: "Krypta Chat – Secure encrypted messenger"
publish_to: 'none'
# 4.2.0, nicht 4.1.1: mit der Sprachauswahl, den Kontaktanfragen und dem
# Aufnahmeschutz kommt echte neue Funktionalitaet dazu, keine Fehlerbehebung.
#
# Die Zahl MUSS ueber allem liegen, was App Store Connect schon kennt — dort
# steht 4.1.0 seit Build 85. Der Preflight prueft das vor dem Bauen; frueher
# fiel es erst nach 26 Minuten beim Upload auf.
#
# Die Build-Nummer hinter dem + ist hier nur Platzhalter: der GitHub-Workflow
# rechnet sie aus (Offset + Lauf-Nummer) und reicht sie per --build-number
# durch.
version: 4.2.0+69

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  provider:

  # Firebase
  firebase_core:
  firebase_auth:
  cloud_firestore:
  firebase_messaging:

  # Encryption (Curve25519, XChaCha20-Poly1305)
  cryptography:
  # Native crypto backends (BoringSSL/CryptoKit) — constant-time, hardware-accelerated
  cryptography_flutter:

  # Secure key/secret storage (Keychain / Keystore)
  flutter_secure_storage:

  # Local database
  path_provider:
  path:

  # Biometric authentication
  local_auth:

  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.2

  # UI
  cupertino_icons: ^1.0.8
  google_fonts:

  # Utilities
  intl:
  uuid:
  equatable:
  crypto:

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
